<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#131c2c"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ffd8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#4aa3ff" stroke-opacity=".22" stroke-width="2"/>
  <path d="M30 200 H226" stroke="#2b3442" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 200 H204" stroke="#4aa3ff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- синий игрок с мечом -->
    <g stroke="url(#blue)" stroke-width="8">
      <circle cx="92" cy="94" r="13" fill="url(#blue)" stroke="none"/>
      <path d="M92 108 V152"/>
      <path d="M92 122 L72 140 M92 122 L108 134"/>
      <path d="M92 152 L78 188 M92 152 L106 188"/>
    </g>
    <path d="M108 134 L138 96" stroke="#e8f2ff" stroke-width="7"/>
    <path d="M100 127 L116 142" stroke="#fbbf24" stroke-width="6"/>

    <!-- зелёный игрок с пистолетом -->
    <g stroke="url(#green)" stroke-width="8">
      <circle cx="168" cy="98" r="12" fill="url(#green)" stroke="none"/>
      <path d="M168 111 V152"/>
      <path d="M168 125 L150 139 M168 125 L188 139"/>
      <path d="M168 152 L155 188 M168 152 L181 188"/>
    </g>
    <path d="M188 139 H212" stroke="#e5e7eb" stroke-width="8"/>
    <path d="M205 139 V151" stroke="#9ca3af" stroke-width="6"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="92" cy="94" r="3.2" fill="#fff"/>
    <circle cx="168" cy="98" r="3" fill="#fff"/>
  </g>
</svg>
